name: "ITALIAN SUNRISE - readonly API access check 2026-11-26"
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: >-
      github.actor == 'nser9444-lang' &&
      github.event.issue.user.login == 'nser9444-lang' &&
      startsWith(github.event.issue.title, '[ITALIAN ADS READONLY CHECK]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_TOKEN_ITALIAN_SUNRISE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r vk_ads_bridge/requirements.txt
      - name: Verify current VK Ads access using GET only
        run: |
          set -euo pipefail
          if [ -z "$VK_ADS_ACCESS_TOKEN" ]; then
            echo "NO_ADS_TOKEN"
            exit 1
          fi
          python -m vk_ads_bridge.cli check
