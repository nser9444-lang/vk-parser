name: "ITALIAN SUNRISE — 14 связок в кампанию 42876719 от 26.11.2026"
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: vkads-italian-sunrise-campaign-42876719
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.actor == 'nser9444-lang' &&
      github.event.issue.user.login == 'nser9444-lang' &&
      github.event.issue.title == '[ITALIAN IMPORT 14 TO 42876719] 26.11.2026 группа-бюджет'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CREATIVE_ARCHIVES_JSON: ${{ github.event.issue.body }}
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_TOKEN_ITALIAN_SUNRISE }}
      VK_ADS_ALLOW_CREATE: "1"
      VK_ADS_BATCH_CONFIRM: "COPY_14_BLOCKED_TO_42876719"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and verify API schema integration tests
        run: |
          python -m pip install -r vk_ads_bridge/requirements.txt
          python -m unittest discover -s vk_ads_bridge/tests -v
          python -m py_compile vk_ads_bridge/import_all_italian_creatives_20261126.py

      - name: Import all genuine creative formats as BLOCKED ads and verify saved roles
        run: python -m vk_ads_bridge.import_14_to_42876719_20261126 --apply

      - name: Upload detailed safe receipts (even if a group failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italian-sunrise-42876719-26nov-14-blocked-ads-results
          path: |
            vkads-import-42876719-20261126/upload-report.json
            vkads-import-42876719-20261126/receipts/
          if-no-files-found: warn
          retention-days: 30

      - name: State outcome on issue without disclosing signed archive URLs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Загрузка 14 связок №2–15 в новую кампанию 42876719 (дата 26.11.2026) завершилась. Бюджет на уровне групп скопирован из шаблона кампании и проверен через API. Для каждого создано одно ОСТАНОВЛЕННОЕ объявление, четыре главных изображения + иконка проверены через VK Ads API. Подробный отчёт — в артефакте этого запуска. Показы НЕ включены."
          else
            gh issue comment "$ISSUE_NUMBER" --body "Загрузка остановлена из-за ошибки. Возможна частичная загрузка: не перезапускайте без проверки отчёта vkads-import-42876719-20261126/upload-report.json и кабинета. Показы НЕ включались."
          fi
