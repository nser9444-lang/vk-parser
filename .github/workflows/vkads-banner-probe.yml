name: "ITALIAN SUNRISE — проверить поля объявления"
on:
  push:
    branches: [main]
    paths: [".github/workflows/vkads-banner-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_TOKEN_ITALIAN_SUNRISE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r vk_ads_bridge/requirements.txt
      - name: "Только GET, не выводить значения рекламных полей"
        run: python -m vk_ads_bridge.probe_banner_fields
