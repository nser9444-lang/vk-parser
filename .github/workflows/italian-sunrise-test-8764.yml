name: "ITALIAN SUNRISE — тест объявления костюма 8764"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/italian-sunrise-test-8764.yml"

permissions:
  contents: read

concurrency:
  group: "vkads-italian-sunrise-8764"
  cancel-in-progress: false

jobs:
  create-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_TOKEN_ITALIAN_SUNRISE }}
      VK_ADS_ALLOW_CREATE: "1"
      JOB_PATH: vk_ads_bridge/test_8764/job.json
    steps:
      - name: "Проверить токен"
        shell: bash
        run: |
          if [ -z "$VK_ADS_ACCESS_TOKEN" ]; then
            echo "::error::Нет VK_ADS_TOKEN_ITALIAN_SUNRISE"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Установить Pillow и requests"
        run: python -m pip install -r vk_ads_bridge/requirements.txt
      - name: "Unit-тесты API интеграции"
        run: python -m unittest discover -s vk_ads_bridge/tests -v
      - name: "Скачать исходные снимки VK, сверить SHA256 и собрать адаптации"
        run: python -m vk_ads_bridge.build_test_8764
      - name: "Проверка всех условий без отправки в VK"
        run: python -m vk_ads_bridge.one_ad_group "$JOB_PATH"
      - name: "Создать новую остановленную группу с одним объявлением"
        run: |
          python -m vk_ads_bridge.one_ad_group "$JOB_PATH" \
            --apply --confirm-campaign-id 42378407 --receipt-dir vkads-receipts
      - name: "Сохранить оригинальные фото, адаптации и ID объявления"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italian-sunrise-test-8764-creatives-and-result
          path: |
            vk_ads_bridge/test_8764/
            vkads-receipts/
          if-no-files-found: warn
          retention-days: 30
