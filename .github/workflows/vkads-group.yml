name: "ITALIAN SUNRISE — проверить рекламную группу"
on:
  workflow_dispatch:
    inputs:
      group_id:
        description: "ID одной рекламной группы VK Ads (только число)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect-group:
    name: "Проверка группы только на чтение"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROUP_ID: ${{ inputs.group_id }}
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_TOKEN_ITALIAN_SUNRISE }}
    steps:
      - name: "Проверить входные данные"
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Выберите ветку main"
            exit 1
          fi
          if ! [[ "$GROUP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Укажите числовой ID рекламной группы"
            exit 1
          fi
          if [ -z "$VK_ADS_ACCESS_TOKEN" ]; then
            echo "::error::Не найден секрет VK_ADS_TOKEN_ITALIAN_SUNRISE"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Установить зависимости"
        run: python -m pip install -r vk_ads_bridge/requirements.txt
      - name: "Прочитать статус и формат группы без изменений"
        run: python vk_ads_bridge/cli.py group --id "$GROUP_ID"
