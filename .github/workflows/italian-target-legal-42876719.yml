name: "ITALIAN SUNRISE — inspect legal labels in target campaign 42876719"
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: >-
      github.actor == 'nser9444-lang' &&
      github.event.issue.user.login == 'nser9444-lang' &&
      startsWith(github.event.issue.title, '[ITALIAN LEGAL TEMPLATE 42876719]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_TOKEN_ITALIAN_SUNRISE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r vk_ads_bridge/requirements.txt
      - name: Verify ad disclosures in existing target groups (GET only)
        run: |
          python - <<'PY'
          import json,time
          from vk_ads_bridge.cli import VKAds
          api=VKAds()
          out=[]
          for gid in (169616554,169616555,169616556,169616557):
              data=api.request("GET","/api/v2/banners.json",
                 params={"_campaign_id":str(gid),"fields":"id,textblocks,status","limit":50})
              items=data.get("items") or []
              has_legal=any(isinstance((z.get("textblocks") or {}).get("about_company_115"),dict)
                      and bool((z.get("textblocks") or {}).get("about_company_115",{}).get("text"))
                      for z in items)
              out.append({"group_id":gid,"banner_count_first_page":len(items),"legal_text_found":has_legal})
              time.sleep(1.8)
          print("TARGET_LEGAL_CHECK",json.dumps(out,ensure_ascii=False))
          PY
