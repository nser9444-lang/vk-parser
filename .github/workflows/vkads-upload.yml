name: "VK Ads — загрузить остановленные объявления"
on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "Путь к JSON заданию в репозитории"
        required: true
        type: string
      group_id:
        description: "ID заранее остановленной группы VK Ads"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vkads-${{ inputs.group_id }}
  cancel-in-progress: false

jobs:
  upload-disabled-ads:
    name: "Создание объявлений со статусом blocked"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPEC_PATH: ${{ inputs.spec_path }}
      GROUP_ID: ${{ inputs.group_id }}
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_ACCESS_TOKEN }}
      VK_ADS_CLIENT_ID: ${{ secrets.VK_ADS_CLIENT_ID }}
      VK_ADS_CLIENT_SECRET: ${{ secrets.VK_ADS_CLIENT_SECRET }}
      VK_ADS_ALLOW_CREATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: "Проверка ветки (только main)"
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Разрешён только запуск из main" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Установка зависимостей"
        run: python -m pip install -r vk_ads_bridge/requirements.txt
      - name: "Тестирование"
        run: python -m unittest discover -s vk_ads_bridge/tests -v
      - name: "Проверка задания без отправки в VK"
        run: python vk_ads_bridge/cli.py validate "$SPEC_PATH"
      - name: "Проверка секретов"
        shell: bash
        run: |
          if [ -z "$VK_ADS_ACCESS_TOKEN" ] && { [ -z "$VK_ADS_CLIENT_ID" ] || [ -z "$VK_ADS_CLIENT_SECRET" ]; }; then
            echo "Добавьте VK_ADS_ACCESS_TOKEN или оба секрета VK_ADS_CLIENT_ID / VK_ADS_CLIENT_SECRET" >&2
            exit 1
          fi
      - name: "Загрузка креативов в остановленную группу"
        run: |
          python vk_ads_bridge/cli.py upload "$SPEC_PATH" \
            --apply --confirm-group-id "$GROUP_ID" \
            --receipt-dir vkads-receipts
      - name: "Сохранить IDs и статусы в артефакте"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-ads-upload-receipt
          path: vkads-receipts/
          if-no-files-found: ignore
          retention-days: 30
