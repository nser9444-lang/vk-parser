name: "ITALIAN SUNRISE — private artifact transfer test"
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  test:
    if: >-
      github.actor == 'nser9444-lang' &&
      github.event.issue.user.login == 'nser9444-lang' &&
      startsWith(github.event.issue.title, '[ITALIAN ASSET TRANSFER TEST]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_URL: ${{ github.event.issue.body }}
    steps:
      - name: GET limited sample only; never print signed URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.parse
          url=os.environ["ARTIFACT_URL"].strip()
          u=urllib.parse.urlsplit(url)
          assert u.scheme=="https" and (u.hostname or "").endswith(".oaiusercontent.com"),"Unexpected archive source"
          req=urllib.request.Request(url,headers={"User-Agent":"ItalianSunriseVKAdsAssetBridge/1"})
          with urllib.request.urlopen(req,timeout=25) as r:
              prefix=r.read(1024)
              print("ASSET_TRANSFER_STATUS",r.status)
              print("ZIP_FILE_HEADER_OK",prefix[:2]==b"PK")
              print("RESPONSE_MIME",r.headers.get("content-type","")[:60])
              if prefix[:2]!=b"PK": raise ValueError("Not a ZIP file")
          PY
