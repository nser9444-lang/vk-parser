name: "VK Ads Bridge — тесты"
on:
  pull_request:
    paths:
      - 'vk_ads_bridge/**'
      - '.github/workflows/vkads-tests.yml'
  push:
    paths:
      - 'vk_ads_bridge/**'
      - '.github/workflows/vkads-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r vk_ads_bridge/requirements.txt
      - run: python -m unittest discover -s vk_ads_bridge/tests -v
      - run: python -m compileall -q vk_ads_bridge
