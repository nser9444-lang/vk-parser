name: "ITALIAN SUNRISE — новая группа с 1 объявлением"
on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "Путь к JSON задания и двум изображениям внутри репозитория"
        required: true
        type: string
      confirmation:
        description: "Чтобы создать ОСТАНОВЛЕННУЮ группу, напишите CREATE_BLOCKED"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vkads-italian-sunrise-campaign-42378407
  cancel-in-progress: false

jobs:
  make-one-group:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPEC_PATH: ${{ inputs.spec_path }}
      CONFIRMATION: ${{ inputs.confirmation }}
      VK_ADS_ACCESS_TOKEN: ${{ secrets.VK_ADS_TOKEN_ITALIAN_SUNRISE }}
      CAMPAIGN_ID: "42378407"
    steps:
      - name: "Проверить ручное подтверждение и наличие токена"
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Выберите ветку main"
            exit 1
          fi
          if [ "$CONFIRMATION" != "CREATE_BLOCKED" ]; then
            echo "::error::Введите CREATE_BLOCKED для подтверждения"
            exit 1
          fi
          if [ -z "$VK_ADS_ACCESS_TOKEN" ]; then
            echo "::error::Нет секрета VK_ADS_TOKEN_ITALIAN_SUNRISE"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Установить зависимости"
        run: python -m pip install -r vk_ads_bridge/requirements.txt
      - name: "Проверить тесты интеграции"
        run: python -m unittest discover -s vk_ads_bridge/tests -v
      - name: "Проверить задание, ничего не отправляя"
        run: python -m vk_ads_bridge.one_ad_group "$SPEC_PATH"
      - name: "Создать остановленную группу и одно объявление"
        env:
          VK_ADS_ALLOW_CREATE: "1"
        run: |
          python -m vk_ads_bridge.one_ad_group "$SPEC_PATH" \
            --apply --confirm-campaign-id "$CAMPAIGN_ID" \
            --receipt-dir vkads-receipts
      - name: "Сохранить отчёт"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italian-sunrise-one-blocked-ad
          path: vkads-receipts/
          if-no-files-found: ignore
          retention-days: 30
